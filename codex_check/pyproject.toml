[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-sync"
version = "0.2.0"
description = "Local Codex Desktop session sync CLI"
readme = "USAGE.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-sync = "codex_check.sync_tool:main"

[tool.setuptools]
packages = ["codex_check"]
